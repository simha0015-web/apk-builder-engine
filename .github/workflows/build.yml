name: Build Enterprise Android APK and AAB

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse Configuration Payload
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(process.env.CONFIG_JSON);
            fs.writeFileSync("config.json", JSON.stringify(config, null, 2));
            console.log("App Name:", config.app_name);
            console.log("Package:", config.package_name);
          '
        env:
          CONFIG_JSON: ${{ github.event.client_payload.config_json }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Project & Unpack Source
        run: |
          APP_NAME=$(node -p "require('./config.json').app_name")
          PKG_NAME=$(node -p "require('./config.json').package_name")
          SOURCE_TYPE=$(node -p "require('./config.json').source_type")
          HAS_ZIP=$(node -p "require('./config.json').has_custom_zip")
          HAS_HTML=$(node -p "require('./config.json').has_custom_html")

          mkdir -p workspace
          cd workspace

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PKG_NAME" --web-dir "www"
          mkdir -p www

          if [ "$SOURCE_TYPE" = "url" ]; then
            cat << 'EOF' > www/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>body{background:#0b0f19;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;}</style>
            </head>
            <body>
              <div style="text-align:center;">
                <div style="width:40px;height:40px;border:3px solid #38bdf8;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
                <p style="margin-top:15px;">Loading App...</p>
              </div>
              <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
            </body>
            </html>
          EOF
          elif [ "$SOURCE_TYPE" = "zip" ] && [ "$HAS_ZIP" = "true" ]; then
            unzip -o ../build_cache/project.zip -d www/
          elif [ "$SOURCE_TYPE" = "raw_html" ] && [ "$HAS_HTML" = "true" ]; then
            cp ../build_cache/index.html www/index.html
          elif [ "$SOURCE_TYPE" = "raw_html" ]; then
            node -e "
              const fs = require('fs');
              const cfg = require('../config.json');
              if (cfg.html_content) {
                fs.writeFileSync('www/index.html', cfg.html_content);
              }
            "
          fi

          npx cap add android

      - name: Force Pure Native In-App Engine with License Security Lock
        run: |
          cd workspace

          SOURCE_TYPE=$(node -p "require('../config.json').source_type")
          TARGET_URL=$(node -p "require('../config.json').web_url || ''")
          PKG_PATH=$(node -p "require('../config.json').package_name.replace(/\./g, '/')")
          TARGET_FILE="android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          PKG_NAME=$(node -p "require('../config.json').package_name")
          APP_NAME=$(node -p "require('../config.json').app_name")

          # ప్రతి యాప్‌కు ప్రత్యేకమైన సీక్రెట్ కీ అల్గారిథమ్
          SECRET_SALT=$(node -e "
            let hash = 0;
            const str = '${PKG_NAME}' + 'secret_pass_2026';
            for (let i = 0; i < str.length; i++) {
              hash = ((hash << 5) - hash) + str.charCodeAt(i);
              hash |= 0;
            }
            console.log(Math.abs(hash).toString(16).toUpperCase().padStart(8, '0').substring(0, 8));
          ")

          cat << EOF > "$TARGET_FILE"
          package ${PKG_NAME};

          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private LinearLayout lockLayout;
              private static final String PREFS_NAME = "AppLicensePrefs";
              private static final String KEY_ACTIVATED = "is_activated";
              private static final String APP_SALT = "${SECRET_SALT}";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  boolean isActivated = prefs.getBoolean(KEY_ACTIVATED, false);

                  if (isActivated) {
                      loadMainApplication();
                  } else {
                      showActivationScreen();
                  }
              }

              private void showActivationScreen() {
                  lockLayout = new LinearLayout(this);
                  lockLayout.setOrientation(LinearLayout.VERTICAL);
                  lockLayout.setGravity(Gravity.CENTER);
                  lockLayout.setPadding(60, 60, 60, 60);
                  lockLayout.setBackgroundColor(Color.parseColor("#0b0f19"));

                  TextView title = new TextView(this);
                  title.setText("🔒 ${APP_NAME}");
                  title.setTextSize(24);
                  title.setTextColor(Color.parseColor("#38bdf8"));
                  title.setGravity(Gravity.CENTER);
                  lockLayout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("ఈ యాప్ ఉపయోగించడానికి లైసెన్స్ కీ నమోదు చేయండి.\nకీ పొందడానికి డెవలపర్‌ని సంప్రదించండి.");
                  subtitle.setTextSize(14);
                  subtitle.setTextColor(Color.parseColor("#94a3b8"));
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, 20, 0, 40);
                  lockLayout.addView(subtitle);

                  final EditText keyInput = new EditText(this);
                  keyInput.setHint("Enter License Activation Key");
                  keyInput.setHintTextColor(Color.parseColor("#64748b"));
                  keyInput.setTextColor(Color.WHITE);
                  keyInput.setPadding(40, 35, 40, 35);
                  keyInput.setBackgroundColor(Color.parseColor("#151d30"));
                  lockLayout.addView(keyInput);

                  Button activateBtn = new Button(this);
                  activateBtn.setText("⚡ Activate App");
                  activateBtn.setTextColor(Color.WHITE);
                  activateBtn.setBackgroundColor(Color.parseColor("#2563eb"));
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  btnParams.setMargins(0, 30, 0, 0);
                  activateBtn.setLayoutParams(btnParams);

                  activateBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          String enteredKey = keyInput.getText().toString().trim().toUpperCase();
                          String expectedKey = "KEY-" + APP_SALT;

                          if (enteredKey.equals(expectedKey)) {
                              getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                                  .edit()
                                  .putBoolean(KEY_ACTIVATED, true)
                                  .apply();
                              Toast.makeText(MainActivity.this, "✅ లైసెన్స్ యాక్టివేట్ అయింది!", Toast.LENGTH_SHORT).show();
                              loadMainApplication();
                          } else {
                              Toast.makeText(MainActivity.this, "❌ చెల్లని కీ! దయచేసి సరైన కీ ఎంటర్ చేయండి.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  lockLayout.addView(activateBtn);

                  setContentView(lockLayout);
              }

              private void loadMainApplication() {
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUserAgentString(settings.getUserAgentString() + " EnterpriseNativeApp/1.0");

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              view.loadUrl(url);
                              return true;
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          } catch (Exception e) {
                              return true;
                          }
                      }
                  });

                  if ("${SOURCE_TYPE}".equals("url")) {
                      webView.loadUrl("${TARGET_URL}");
                  } else {
                      webView.loadUrl("file:///android_asset/public/index.html");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Configure App Icon & Fix AndroidManifest
        run: |
          cd workspace

          # Custom App Icon Handling
          HAS_ICON=$(node -p "require('../config.json').has_custom_icon")
          if [ "$HAS_ICON" = "true" ] && [ -f "../build_cache/icon.png" ]; then
            echo "Applying custom user icon safely..."

            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
            rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
            rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

            for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$res
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_round.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_foreground.png
            done
          fi

          # AndroidManifest Injection
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(manifestPath, "utf8");
            const payload = require("../config.json");
            const p = payload.permissions || {};

            let perms = "\n";
            if (p.internet) perms += "    <uses-permission android:name=\"android.permission.INTERNET\" />\n";
            if (p.camera) perms += "    <uses-permission android:name=\"android.permission.CAMERA\" />\n";
            if (p.fine_location) perms += "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n";
            if (p.coarse_location) perms += "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n";
            if (p.storage) perms += "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n";
            if (p.audio) perms += "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n";
            if (p.notifications) perms += "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n";
            if (p.bluetooth) perms += "    <uses-permission android:name=\"android.permission.BLUETOOTH\" />\n";

            content = content.replace("<application", perms + "    <application");

            if (payload.orientation && payload.orientation !== "unspecified") {
              content = content.replace("android:screenOrientation=\"unspecified\"", "android:screenOrientation=\"" + payload.orientation + "\"");
            }

            content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"");

            fs.writeFileSync(manifestPath, content);
          '

          npx cap sync android

      - name: Resolve Kotlin Duplicate Classes & Build Binaries
        run: |
          cd workspace/android
          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 1. Signing Configuration Fix
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/' app/build.gradle

          # 2. Kotlin Duplicate Class Fix
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                          }
                      }
                  }
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          # 3. Gradle Performance Tuning
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.parallel=false
          org.gradle.daemon=false
          EOF

          # 4. Build APK & AAB
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

          SLUG=$(node -p "require('../../config.json').app_slug")
          
          cp app/build/outputs/apk/debug/app-debug.apk ../../${SLUG}-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../${SLUG}-release.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ fromJson(github.event.client_payload.config_json).app_slug }}-v${{ fromJson(github.event.client_payload.config_json).version_code }}"
          name: "${{ fromJson(github.event.client_payload.config_json).app_name }} v${{ fromJson(github.event.client_payload.config_json).version_name }}"
          files: |
            *-debug.apk
            *-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apps.json Database & Cleanup Cache
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main || true

          SLUG=$(node -p "require('./config.json').app_slug")
          PKG=$(node -p "require('./config.json').package_name")
          VCODE=$(node -p "require('./config.json').version_code")
          RELEASE_TAG="release-${SLUG}-v${VCODE}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-debug.apk"
          AAB_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-release.aab"

          node -e "
            const fs = require('fs');
            const file = 'apps.json';
            let data = [];
            if (fs.existsSync(file)) {
              try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch(e){}
            }
            const payload = require('./config.json');
            const appIndex = data.findIndex(a => a.package_name === payload.package_name);
            
            // Deterministic Key Matching Web Dashboard
            let hash = 0;
            const str = '${PKG}' + 'secret_pass_2026';
            for (let i = 0; i < str.length; i++) {
              hash = ((hash << 5) - hash) + str.charCodeAt(i);
              hash |= 0;
            }
            const licenseKey = 'KEY-' + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0').substring(0, 8);

            const existingApp = appIndex >= 0 ? data[appIndex] : {};

            const appDetails = {
              name: payload.app_name,
              package_name: payload.package_name,
              version: payload.version_name,
              version_code: payload.version_code,
              source_type: payload.source_type,
              apk_url: '${APK_URL}',
              aab_url: '${AAB_URL}',
              is_paid: existingApp.is_paid || false,
              license_key: licenseKey,
              updated_at: new Date().toISOString()
            };

            if(appIndex >= 0) {
              data[appIndex] = appDetails;
            } else {
              data.push(appDetails);
            }

            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

          rm -rf build_cache config.json workspace

          git add apps.json build_cache || true
          git commit -m "Build completed: $(node -p "require('./config.json').app_name")" || echo "No changes"
          git push origin main
