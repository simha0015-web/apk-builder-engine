name: Build Enterprise Android APK and AAB

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Project & Unpack Source
        run: |
          mkdir -p workspace
          cd workspace

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ github.event.client_payload.app_name }}" "${{ github.event.client_payload.package_name }}" --web-dir "www"
          mkdir -p www

          SOURCE_TYPE="${{ github.event.client_payload.source_type }}"

          if [ "$SOURCE_TYPE" = "zip" ]; then
            echo "${{ github.event.client_payload.zip_base64 }}" | base64 -d > project.zip
            unzip -o project.zip -d www/
          elif [ "$SOURCE_TYPE" = "url" ]; then
            cat << 'EOF' > www/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>body,html,iframe{margin:0;padding:0;height:100%;width:100%;border:none;overflow:hidden;}</style>
            </head>
            <body>
              <script>window.location.href = "${{ github.event.client_payload.web_url }}";</script>
            </body>
            </html>
          EOF
          elif [ "$SOURCE_TYPE" = "raw_html" ]; then
            echo '${{ github.event.client_payload.html_content }}' > www/index.html
          fi

          npx cap add android

      - name: Configure App Icon & Manifest Permissions
        run: |
          cd workspace

          # Custom App Icon Handling
          ICON_BASE64="${{ github.event.client_payload.icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > custom_icon.png
            for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$res
              cp custom_icon.png android/app/src/main/res/mipmap-$res/ic_launcher.png
              cp custom_icon.png android/app/src/main/res/mipmap-$res/ic_launcher_round.png
            done
          fi

          # AndroidManifest Permissions & Settings Injection
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(manifestPath, "utf8");
            const payload = ${{ toJson(github.event.client_payload) }};
            const p = payload.permissions || {};

            let perms = "";
            if (p.internet) perms += "\n    <uses-permission android:name=\"android.permission.INTERNET\" />";
            if (p.camera) perms += "\n    <uses-permission android:name=\"android.permission.CAMERA\" />";
            if (p.fine_location) perms += "\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />";
            if (p.coarse_location) perms += "\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />";
            if (p.storage) perms += "\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />";
            if (p.audio) perms += "\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />";
            if (p.notifications) perms += "\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />";
            if (p.bluetooth) perms += "\n    <uses-permission android:name=\"android.permission.BLUETOOTH\" />";

            content = content.replace("<manifest", "<manifest" + perms);

            // Orientation
            if (payload.orientation && payload.orientation !== "unspecified") {
              content = content.replace("android:screenOrientation=\"unspecified\"", `android:screenOrientation=\"${payload.orientation}\"`);
            }

            // Cleartext Traffic (HTTP)
            if (payload.cleartext) {
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }

            fs.writeFileSync(manifestPath, content);
          '

          npx cap sync android

      - name: Build Release Binaries (Gradle APK & AAB)
        run: |
          cd workspace/android

          # Keystore Management
          KEYSTORE="release.jks"
          keytool -genkey -v -keystore $KEYSTORE -alias app-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "buildsecret99" -keypass "buildsecret99" \
            -dname "CN=Builder, OU=Dev, O=App, L=Hyd, S=TS, C=IN"

          ./gradlew assembleDebug
          ./gradlew bundleRelease

          cp app/build/outputs/apk/debug/app-debug.apk ../../${{ github.event.client_payload.app_slug }}-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../${{ github.event.client_payload.app_slug }}-release.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.event.client_payload.app_slug }}-v${{ github.event.client_payload.version_code }}"
          name: "${{ github.event.client_payload.app_name }} v${{ github.event.client_payload.version_name }}"
          files: |
            *-debug.apk
            *-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apps.json Database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main || true

          RELEASE_TAG="release-${{ github.event.client_payload.app_slug }}-v${{ github.event.client_payload.version_code }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${{ github.event.client_payload.app_slug }}-debug.apk"
          AAB_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${{ github.event.client_payload.app_slug }}-release.aab"

          node -e "
            const fs = require('fs');
            const file = 'apps.json';
            let data = [];
            if (fs.existsSync(file)) {
              try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch(e){}
            }
            const payload = ${{ toJson(github.event.client_payload) }};
            const appIndex = data.findIndex(a => a.package_name === payload.package_name);
            
            const appDetails = {
              name: payload.app_name,
              package_name: payload.package_name,
              version: payload.version_name,
              version_code: payload.version_code,
              source_type: payload.source_type,
              apk_url: '${APK_URL}',
              aab_url: '${AAB_URL}',
              updated_at: new Date().toISOString()
            };

            if(appIndex >= 0) {
              data[appIndex] = appDetails;
            } else {
              data.push(appDetails);
            }

            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

          git add apps.json
          git commit -m "Store binary metadata: ${{ github.event.client_payload.app_name }}" || echo "No changes"
          git push origin main
