name: Build Enterprise Android APK and AAB

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse Configuration Payload
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(process.env.CONFIG_JSON);
            fs.writeFileSync("config.json", JSON.stringify(config, null, 2));
            console.log("App Name:", config.app_name);
            console.log("Package:", config.package_name);
          '
        env:
          CONFIG_JSON: ${{ github.event.client_payload.config_json }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Project & Unpack Source
        run: |
          APP_NAME=$(node -p "require('./config.json').app_name")
          PKG_NAME=$(node -p "require('./config.json').package_name")
          SOURCE_TYPE=$(node -p "require('./config.json').source_type")
          HAS_ZIP=$(node -p "require('./config.json').has_custom_zip")

          mkdir -p workspace
          cd workspace

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PKG_NAME" --web-dir "www"
          mkdir -p www

          if [ "$SOURCE_TYPE" = "zip" ] && [ "$HAS_ZIP" = "true" ]; then
            unzip -o ../build_cache/project.zip -d www/
          elif [ "$SOURCE_TYPE" = "url" ]; then
            WEB_URL=$(node -p "require('../config.json').web_url")
            cat << EOF > www/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>body,html,iframe{margin:0;padding:0;height:100%;width:100%;border:none;overflow:hidden;}</style>
            </head>
            <body>
              <script>window.location.href = "$WEB_URL";</script>
            </body>
            </html>
          EOF
          elif [ "$SOURCE_TYPE" = "raw_html" ]; then
            node -e "
              const fs = require('fs');
              const cfg = require('../config.json');
              fs.writeFileSync('www/index.html', cfg.html_content);
            "
          fi

          npx cap add android

      - name: Configure App Icon & Fix AndroidManifest
        run: |
          cd workspace

          # 1. Custom App Icon - Full Android Adaptive & Legacy Icon Replacement
          HAS_ICON=$(node -p "require('../config.json').has_custom_icon")
          if [ "$HAS_ICON" = "true" ] && [ -f "../build_cache/icon.png" ]; then
            echo "Applying custom user icon across all mipmap folders..."
            
            # అన్ని mipmap డెన్సిటీలలోకి మీ ఐకాన్ కాపీ చేయడం
            for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$res
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_round.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_foreground.png
            done

            # Capacitor డిఫాల్ట్ Adaptive Icon XML ఫైల్స్ తొలగించడం (దీనివల్ల నేరుగా మీ PNG ఐకాన్ ఫోన్‌లో కనిపిస్తుంది)
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            mkdir -p android/app/src/main/res/drawable
            cp ../build_cache/icon.png android/app/src/main/res/drawable/ic_launcher_background.png || true
            cp ../build_cache/icon.png android/app/src/main/res/drawable/ic_launcher_foreground.png || true
          fi

          # 2. AndroidManifest Permissions & Settings Injection
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(manifestPath, "utf8");
            const payload = require("../config.json");
            const p = payload.permissions || {};

            let perms = "\n";
            if (p.internet) perms += "    <uses-permission android:name=\"android.permission.INTERNET\" />\n";
            if (p.camera) perms += "    <uses-permission android:name=\"android.permission.CAMERA\" />\n";
            if (p.fine_location) perms += "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n";
            if (p.coarse_location) perms += "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n";
            if (p.storage) perms += "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n";
            if (p.audio) perms += "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n";
            if (p.notifications) perms += "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n";
            if (p.bluetooth) perms += "    <uses-permission android:name=\"android.permission.BLUETOOTH\" />\n";

            content = content.replace("<application", perms + "    <application");

            if (payload.orientation && payload.orientation !== "unspecified") {
              content = content.replace("android:screenOrientation=\"unspecified\"", "android:screenOrientation=\"" + payload.orientation + "\"");
            }

            if (payload.cleartext) {
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }

            fs.writeFileSync(manifestPath, content);
          '

          npx cap sync android

      - name: Resolve Kotlin Duplicate Classes & Build Binaries
        run: |
          cd workspace/android
          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 1. Signing Configuration Fix
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/' app/build.gradle

          # 2. Kotlin Duplicate Class Fix
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                          }
                      }
                  }
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          # 3. Gradle Performance Tuning
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.parallel=false
          org.gradle.daemon=false
          EOF

          # 4. Build APK & AAB
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

          SLUG=$(node -p "require('../../config.json').app_slug")
          
          cp app/build/outputs/apk/debug/app-debug.apk ../../${SLUG}-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../${SLUG}-release.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ fromJson(github.event.client_payload.config_json).app_slug }}-v${{ fromJson(github.event.client_payload.config_json).version_code }}"
          name: "${{ fromJson(github.event.client_payload.config_json).app_name }} v${{ fromJson(github.event.client_payload.config_json).version_name }}"
          files: |
            *-debug.apk
            *-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apps.json Database & Cleanup Cache
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main || true

          SLUG=$(node -p "require('./config.json').app_slug")
          VCODE=$(node -p "require('./config.json').version_code")
          RELEASE_TAG="release-${SLUG}-v${VCODE}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-debug.apk"
          AAB_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-release.aab"

          node -e "
            const fs = require('fs');
            const file = 'apps.json';
            let data = [];
            if (fs.existsSync(file)) {
              try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch(e){}
            }
            const payload = require('./config.json');
            const appIndex = data.findIndex(a => a.package_name === payload.package_name);
            
            const appDetails = {
              name: payload.app_name,
              package_name: payload.package_name,
              version: payload.version_name,
              version_code: payload.version_code,
              source_type: payload.source_type,
              apk_url: '${APK_URL}',
              aab_url: '${AAB_URL}',
              updated_at: new Date().toISOString()
            };

            if(appIndex >= 0) {
              data[appIndex] = appDetails;
            } else {
              data.push(appDetails);
            }

            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

          rm -rf build_cache config.json workspace

          git add apps.json build_cache || true
          git commit -m "Build completed: $(node -p "require('./config.json').app_name")" || echo "No changes"
          git push origin main
