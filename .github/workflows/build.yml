name: Build Enterprise Android APK and AAB

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse Configuration Payload
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(process.env.CONFIG_JSON);
            fs.writeFileSync("config.json", JSON.stringify(config, null, 2));
            console.log("App Name:", config.app_name);
            console.log("Package:", config.package_name);
          '
        env:
          CONFIG_JSON: ${{ github.event.client_payload.config_json }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Project & Unpack Source
        run: |
          APP_NAME=$(node -p "require('./config.json').app_name")
          PKG_NAME=$(node -p "require('./config.json').package_name")
          SOURCE_TYPE=$(node -p "require('./config.json').source_type")
          HAS_ZIP=$(node -p "require('./config.json').has_custom_zip")
          HAS_HTML=$(node -p "require('./config.json').has_custom_html")

          mkdir -p workspace
          cd workspace

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PKG_NAME" --web-dir "www"
          mkdir -p www

          if [ "$SOURCE_TYPE" = "url" ]; then
            cat << 'EOF' > www/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>body{background:#0b0f19;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;}</style>
            </head>
            <body>
              <div style="text-align:center;">
                <div style="width:40px;height:40px;border:3px solid #38bdf8;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
                <p style="margin-top:15px;">Loading App...</p>
              </div>
              <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
            </body>
            </html>
          EOF
          elif [ "$SOURCE_TYPE" = "zip" ] && [ "$HAS_ZIP" = "true" ]; then
            unzip -o ../build_cache/project.zip -d www/
          elif [ "$SOURCE_TYPE" = "raw_html" ] && [ "$HAS_HTML" = "true" ]; then
            cp ../build_cache/index.html www/index.html
          elif [ "$SOURCE_TYPE" = "raw_html" ]; then
            node -e "
              const fs = require('fs');
              const cfg = require('../config.json');
              if (cfg.html_content) {
                fs.writeFileSync('www/index.html', cfg.html_content);
              }
            "
          fi

          npx cap add android

      - name: Build Crash-Proof Enterprise Security Lock
        run: |
          cd workspace

          SOURCE_TYPE=$(node -p "require('../config.json').source_type")
          TARGET_URL=$(node -p "require('../config.json').web_url || ''")
          PKG_PATH=$(node -p "require('../config.json').package_name.replace(/\./g, '/')")
          TARGET_FILE="android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          PKG_NAME=$(node -p "require('../config.json').package_name")
          APP_NAME=$(node -p "require('../config.json').app_name")

          cat << 'EOF' > "$TARGET_FILE"
          package ${PKG_NAME};

          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.app.Dialog;
          import android.content.DialogInterface;
          import android.view.KeyEvent;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String PREFS_NAME = "EnterpriseAppSecurityPrefs";
              private static final String KEY_IS_UNLOCKED = "client_app_unlocked_status";
              private static final String APP_PKG = "${PKG_NAME}";
              private Dialog lockDialog;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  boolean isUnlocked = prefs.getBoolean(KEY_IS_UNLOCKED, false);

                  if (!isUnlocked) {
                      showStrictLockDialog();
                  } else {
                      handleRedirection();
                  }
              }

              private boolean verifyKeyChecksum(String key) {
                  if (key == null) return false;
                  String clean = key.trim().toUpperCase();
                  if (!clean.startsWith("KEY-")) return false;

                  String[] segments = clean.split("-");
                  if (segments.length != 3) return false;

                  String clientSlug = segments[1];
                  String providedHex = segments[2];

                  int hash = 0;
                  String saltString = APP_PKG + clientSlug + "secret_pass_2026";
                  for (int i = 0; i < saltString.length(); i++) {
                      hash = ((hash << 5) - hash) + saltString.charAt(i);
                      hash |= 0;
                  }
                  String expectedHex = String.format("%08X", Math.abs(hash)).substring(0, 8);
                  return providedHex.equalsIgnoreCase(expectedHex);
              }

              private void showStrictLockDialog() {
                  lockDialog = new Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                  lockDialog.setCancelable(false);
                  lockDialog.setCanceledOnTouchOutside(false);

                  lockDialog.setOnKeyListener(new DialogInterface.OnKeyListener() {
                      @Override
                      public boolean onKey(DialogInterface dialog, int keyCode, KeyEvent event) {
                          if (keyCode == KeyEvent.KEYCODE_BACK) {
                              finishAffinity();
                              return true;
                          }
                          return false;
                      }
                  });

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(60, 60, 60, 60);
                  root.setBackgroundColor(Color.parseColor("#0b0f19"));
                  root.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  TextView icon = new TextView(this);
                  icon.setText("🔒");
                  icon.setTextSize(48);
                  icon.setGravity(Gravity.CENTER);
                  root.addView(icon);

                  TextView appTitle = new TextView(this);
                  appTitle.setText("${APP_NAME}");
                  appTitle.setTextSize(22);
                  appTitle.setTypeface(null, Typeface.BOLD);
                  appTitle.setTextColor(Color.parseColor("#38bdf8"));
                  appTitle.setGravity(Gravity.CENTER);
                  appTitle.setPadding(0, 20, 0, 10);
                  root.addView(appTitle);

                  TextView msg = new TextView(this);
                  msg.setText("Application is Locked.\nPlease enter your client activation license key to continue.");
                  msg.setTextSize(13);
                  msg.setTextColor(Color.parseColor("#94a3b8"));
                  msg.setGravity(Gravity.CENTER);
                  msg.setPadding(0, 0, 0, 40);
                  root.addView(msg);

                  final EditText inputKey = new EditText(this);
                  inputKey.setHint("Enter License Key (e.g. KEY-C1001-XXXX)");
                  inputKey.setHintTextColor(Color.parseColor("#64748b"));
                  inputKey.setTextColor(Color.WHITE);
                  inputKey.setTextSize(14);
                  inputKey.setPadding(40, 35, 40, 35);
                  inputKey.setBackgroundColor(Color.parseColor("#151d30"));
                  inputKey.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams inputParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  inputKey.setLayoutParams(inputParams);
                  root.addView(inputKey);

                  Button btnActivate = new Button(this);
                  btnActivate.setText("⚡ Activate App");
                  btnActivate.setTextColor(Color.WHITE);
                  btnActivate.setTextSize(15);
                  btnActivate.setTypeface(null, Typeface.BOLD);
                  btnActivate.setBackgroundColor(Color.parseColor("#2563eb"));
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 130);
                  btnParams.setMargins(0, 35, 0, 0);
                  btnActivate.setLayoutParams(btnParams);

                  btnActivate.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          String entered = inputKey.getText().toString().trim().toUpperCase();
                          if (verifyKeyChecksum(entered)) {
                              getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                                  .edit()
                                  .putBoolean(KEY_IS_UNLOCKED, true)
                                  .apply();
                              Toast.makeText(MainActivity.this, "✅ Activation Successful!", Toast.LENGTH_SHORT).show();
                              if (lockDialog != null && lockDialog.isShowing()) {
                                  lockDialog.dismiss();
                              }
                              handleRedirection();
                          } else {
                              Toast.makeText(MainActivity.this, "❌ Invalid License Key! Please verify.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  root.addView(btnActivate);

                  lockDialog.setContentView(root);
                  lockDialog.show();
              }

              private void handleRedirection() {
                  if ("${SOURCE_TYPE}".equals("url") && !"${TARGET_URL}".isEmpty()) {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().post(new Runnable() {
                              @Override
                              public void run() {
                                  getBridge().getWebView().loadUrl("${TARGET_URL}");
                              }
                          });
                      }
                  }
              }
          }
          EOF

          sed -i "s/\${PKG_NAME}/$PKG_NAME/g" "$TARGET_FILE"
          sed -i "s/\${APP_NAME}/$APP_NAME/g" "$TARGET_FILE"
          sed -i "s/\${SOURCE_TYPE}/$SOURCE_TYPE/g" "$TARGET_FILE"
          sed -i "s|\${TARGET_URL}|$TARGET_URL|g" "$TARGET_FILE"

      - name: Configure App Icon & Fix AndroidManifest
        run: |
          cd workspace

          HAS_ICON=$(node -p "require('../config.json').has_custom_icon")
          if [ "$HAS_ICON" = "true" ] && [ -f "../build_cache/icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
            rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
            rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

            for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$res
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_round.png
              cp ../build_cache/icon.png android/app/src/main/res/mipmap-$res/ic_launcher_foreground.png
            done
          fi

          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(manifestPath, "utf8");
            let perms = "\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n";
            content = content.replace("<application", perms + "    <application");
            content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            fs.writeFileSync(manifestPath, content);
          '

          npx cap sync android

      - name: Resolve Kotlin Duplicate Classes & Build Binaries
        run: |
          cd workspace/android
          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/' app/build.gradle

          cat << 'EOF' >> app/build.gradle
          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                          }
                      }
                  }
              }
          }
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.parallel=false
          org.gradle.daemon=false
          EOF

          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

          SLUG=$(node -p "require('../../config.json').app_slug")
          cp app/build/outputs/apk/debug/app-debug.apk ../../${SLUG}-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../${SLUG}-release.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ fromJson(github.event.client_payload.config_json).app_slug }}-v${{ fromJson(github.event.client_payload.config_json).version_code }}"
          name: "${{ fromJson(github.event.client_payload.config_json).app_name }} v${{ fromJson(github.event.client_payload.config_json).version_name }}"
          files: |
            *-debug.apk
            *-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apps.json Database & Cleanup Cache
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main || true

          SLUG=$(node -p "require('./config.json').app_slug")
          PKG=$(node -p "require('./config.json').package_name")
          VCODE=$(node -p "require('./config.json').version_code")
          RELEASE_TAG="release-${SLUG}-v${VCODE}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-debug.apk"
          AAB_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${SLUG}-release.aab"

          node -e "
            const fs = require('fs');
            const file = 'apps.json';
            let data = [];
            if (fs.existsSync(file)) {
              try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch(e){}
            }
            const payload = require('./config.json');
            const appIndex = data.findIndex(a => a.package_name === payload.package_name);

            const existingApp = appIndex >= 0 ? data[appIndex] : {};

            const appDetails = {
              name: payload.app_name,
              package_name: payload.package_name,
              version: payload.version_name,
              version_code: payload.version_code,
              source_type: payload.source_type,
              apk_url: '${APK_URL}',
              aab_url: '${AAB_URL}',
              clients: existingApp.clients || [],
              updated_at: new Date().toISOString()
            };

            if(appIndex >= 0) {
              data[appIndex] = appDetails;
            } else {
              data.push(appDetails);
            }

            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

          rm -rf build_cache config.json workspace

          git add apps.json build_cache || true
          git commit -m "Build completed: $(node -p "require('./config.json').app_name")" || echo "No changes"
          git push origin main
